
name: Generate Contribution Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution graph
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: panos140
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: activity.svg

      - name: Publish graph
        run: |
          mkdir -p activity-assets
          cp activity.svg activity-assets/activity.svg

      - name: Commit generated graph
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add activity-assets/activity.svg
          git diff --cached --quiet || git commit -m "Update contribution graph"
          git push
